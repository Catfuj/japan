<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan">
<meta name="theme-color" content="#152238">
<title>Eight weeks to Japan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23C8412F'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23EFE8D8'>力</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#152238; --sf:#1C2C47; --sf2:#243757; --line:#34496E;
  --tx:#EFE8D8; --mu:#9DA8BD; --gold:#E3B23C; --moss:#A3B86C; --ink:#C8412F; --teal:#6CB6BE;
  --serif:'Shippori Mincho','Hiragino Mincho ProN',Georgia,serif;
  --sans:'Zen Kaku Gothic New','Hiragino Sans',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.2}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
small{color:var(--mu);font-size:.82rem}
main{max-width:620px;margin:0 auto;padding:0 16px}

/* header */
#hd{max-width:620px;margin:0 auto;padding:18px 16px 14px}
.cd{font-family:var(--serif);font-size:1.9rem;font-weight:700;letter-spacing:.01em}
.cd-jp{font-family:var(--serif);color:var(--gold);font-size:1rem;margin-top:2px}
.hd-meta{color:var(--mu);font-size:.88rem;margin-top:6px}

/* sections */
.sec{background:var(--sf);border-radius:16px;padding:16px;margin:0 0 14px}
.sec > h2{margin-bottom:10px}
.sec-sub{color:var(--mu);font-size:.9rem;margin:-4px 0 12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* sessions */
.sess{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess b{display:block;font-weight:500}
.sess.is-done b{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--ink)}
.seal{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.25rem;
  border:1.5px dashed var(--line);color:var(--line)}
.seal.on{background:var(--ink);border:2px solid #E0664F;color:var(--tx);transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.seal.pop{animation:stamp .28s ease-out}
@keyframes stamp{0%{transform:scale(1.6) rotate(-20deg);opacity:.2}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.seal.pop{animation:none}}
.rest{color:var(--mu);font-family:var(--serif);font-size:1.1rem;padding:6px 0}

/* habits */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hab{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--sf2);text-align:left;font-size:.93rem;min-height:48px}
.hab .box{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--mu);display:grid;place-items:center;font-size:.8rem}
.hab.on{background:rgba(163,184,108,.16)}
.hab.on .box{background:var(--moss);border-color:var(--moss);color:var(--bg)}
.hab .auto{display:block;color:var(--mu);font-size:.72rem}

/* stamp card */
.card{background:var(--tx);color:#23304A;border-radius:18px;padding:18px 16px 16px;margin:0 0 14px;position:relative}
.card h2{color:#23304A}
.card .tally{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;color:#23304A}
.card .tally span{font-size:1.2rem;color:#6B7690}
.stamps{margin-top:14px;display:grid;gap:10px}
.st-row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px}
.st-row > span{font-size:.85rem;color:#4A5570}
.st-seals{display:flex;flex-wrap:wrap;gap:8px}
.card .seal{width:40px;height:40px;border-color:#B9B2A2;color:#C9C2B2;font-size:1.15rem}
.card .seal.on{color:#F6EFE0;border-color:#A8321F}
.track{position:relative;height:8px;border-radius:4px;background:#D9D1BF;margin:18px 0 8px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.track b{position:absolute;top:-5px;width:2px;height:18px;background:#23304A}
.verdict{font-size:.95rem;color:#23304A}

.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.wk{border-radius:8px;background:var(--sf2);padding:6px 0;text-align:center;font-size:.8rem;color:var(--mu)}
.wk b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--tx)}
.wk.won{background:rgba(200,65,47,.25)}
.wk.now{outline:1.5px solid var(--gold)}
.wk.sel{background:var(--gold);color:var(--bg)}
.wk.sel b{color:var(--bg)}
.rank{font-family:var(--serif);font-size:1.5rem;color:var(--gold)}

.day{padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h h3{font-size:1rem}
.day.today h3{color:var(--gold)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--sf2);font-size:.85rem}
.mini .seal{width:24px;height:24px;font-size:.8rem;border-width:1px}
.mini.is-done{color:var(--mu)}
.mini{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mini.moved{box-shadow:inset 0 0 0 1.5px var(--gold)}
.mini.dragging{opacity:.3}
.ghost{position:fixed;z-index:10;pointer-events:none;margin:0;box-shadow:0 10px 28px rgba(0,0,0,.45);transform:scale(1.06)}
.day[data-dropday]{padding-left:8px;padding-right:8px;margin:0 -8px;border-radius:10px}
.day.drop-over{background:rgba(227,178,60,.14)}
.tag{font-size:.75rem;color:var(--bg);background:var(--gold);border-radius:999px;padding:1px 8px;margin-left:6px}

/* train */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--sf);font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--bg);font-weight:700}
.warm{margin:0;padding-left:18px;color:var(--mu);font-size:.92rem}
.exl{list-style:none;margin:0;padding:0}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .rx{font-family:var(--serif);color:var(--gold);white-space:nowrap}
.ex-note{display:block;margin-top:2px}
.ex-log{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.88rem;color:var(--mu)}
.ex-log input{width:92px;padding:6px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--sf2);font-weight:500;min-height:44px}
.btn.primary{background:var(--gold);color:var(--bg);font-weight:700}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn[aria-pressed="true"]{background:var(--moss);color:var(--bg)}
.block-note{border-left:3px solid var(--gold);padding-left:10px;color:var(--mu);font-size:.92rem;margin-top:8px}

/* eat */
.prep{display:grid;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick button{padding:7px 12px;border-radius:999px;background:var(--sf2);font-size:.88rem}
.pick button[aria-pressed="true"]{background:var(--moss);color:var(--bg);font-weight:700}
.ed{list-style:none;margin:0 0 10px;padding:0}
.ed li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ed li button{color:var(--mu);font-size:1.3rem;width:36px;height:36px;border-radius:8px}
.add{display:flex;gap:8px}
.add input{flex:1}
.snacks{list-style:none;margin:0;padding:0}
.snacks li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.snacks li:last-child{border-bottom:0}
.snacks small{white-space:nowrap}
.meal{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:.95rem}
.meal dt{color:var(--mu)}
.meal dd{margin:0}

/* track */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--sf2);border-radius:10px;padding:10px}
.tile .v{font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.2}
.tile .v span{font-size:.75rem;color:var(--mu);font-family:var(--sans);font-weight:400}
.tile small{display:block;font-size:.74rem}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mu);font-size:10px;font-family:var(--sans)}
.chart .band{fill:rgba(163,184,108,.18)}
.chart .ma{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round}
.chart .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round}
.chart .stretch{fill:none;stroke:var(--mu);stroke-width:1.2;stroke-dasharray:4 4}
.chart .ref{stroke:var(--moss);stroke-width:1;stroke-dasharray:3 3}
.chart .now{stroke:var(--ink);stroke-width:1}
.chart .dot{fill:var(--tx);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.status{font-size:.95rem;margin-top:8px}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mform label{font-size:.82rem;color:var(--mu);display:grid;gap:4px}
details{margin-top:4px}
summary{cursor:pointer;font-weight:500;padding:6px 0}
.help{font-size:.9rem;color:var(--mu)}
.help ol{padding-left:20px;margin:8px 0}
.help li{margin-bottom:6px}
.help code,pre{background:var(--bg);border-radius:6px;padding:1px 5px;font-size:.84rem;color:var(--tx)}
pre{padding:10px;overflow-x:auto;white-space:pre}
.empty{color:var(--mu);font-size:.9rem;padding:8px 0}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(21,34,56,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:5}
#nav button{flex:1;display:grid;justify-items:center;gap:0;padding:4px 0;color:var(--mu);font-size:.72rem;border-radius:10px}
#nav button .k{font-family:var(--serif);font-size:1.2rem;line-height:1.3}
#nav button[aria-current="page"]{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;z-index:6}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';

/* ---------- Programme constants ---------- */
const START = new Date(2026, 8, 26);    // Saturday 26 September 2026, week 1 day 1
const DEPART = new Date(2026, 10, 21);  // Saturday 21 November 2026
const WEEKS = 8, FLOOR = 10, TOTAL = 13;
const START_KG = 91, REAL_HI = 86, REAL_LO = 84, STRETCH_KG = 81;
const KEY = 'japan8';

const TYPES = {
  strength: { k: '力', n: 'Strength', max: 5 },
  cycle:    { k: '輪', n: 'Cycle', max: 4 },
  run:      { k: '走', n: 'Intervals', max: 1 },
  spin:     { k: '回', n: 'Spin', max: 1 },
  yin:      { k: '陰', n: 'Yin yoga', max: 1 },
  dance:    { k: '舞', n: 'Dance', max: 1 }
};

// Keyed by JS getDay(): 0 Sunday … 6 Saturday
const PLAN = {
  6: [ { id: 'sat-run', t: 'run', n: 'Interval run', m: 'Third Space, 25 min, do this first', s: 'intervals' },
       { id: 'sat-core', t: 'strength', n: 'Core and carry', m: 'Straight after the run, 25 min', s: 'core' } ],
  0: [ { id: 'sun-lowerA', t: 'strength', n: 'Lower A', m: 'Third Space, 50 min', s: 'lowerA' } ],
  1: [ { id: 'mon-cyc1', t: 'cycle', n: 'Cycle to work', m: 'About 45 min, easy' },
       { id: 'mon-cyc2', t: 'cycle', n: 'Cycle home', m: 'About 45 min, easy' } ],
  2: [ { id: 'tue-upperA', t: 'strength', n: 'Upper A', m: 'Third Space, 45 min', s: 'upperA' },
       { id: 'tue-spin', t: 'spin', n: 'Spin class', m: 'Third Space', s: 'classes' } ],
  3: [ { id: 'wed-cyc1', t: 'cycle', n: 'Cycle to work', m: 'About 45 min, easy' },
       { id: 'wed-cyc2', t: 'cycle', n: 'Cycle home', m: 'About 45 min, easy' },
       { id: 'wed-lowerB', t: 'strength', n: 'Lower B', m: 'Third Space, 40 min', s: 'lowerB' },
       { id: 'wed-yin', t: 'yin', n: 'Yin yoga', m: 'Third Space, after Lower B', s: 'classes' } ],
  4: [],
  5: [ { id: 'fri-upperB', t: 'strength', n: 'Upper B', m: 'Third Space, 45 min', s: 'upperB' },
       { id: 'fri-dance', t: 'dance', n: 'Dance class', m: 'Third Space', s: 'classes' } ]
};
const DAYORDER = [6, 0, 1, 2, 3, 4, 5];
const DAYNAME = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const COOK = { 0: 'sun', 4: 'thu' };
const ALLSESS = DAYORDER.flatMap(d => PLAN[d].map(s => Object.assign({ dow: d }, s)));
const SESSBYID = Object.fromEntries(ALLSESS.map(s => [s.id, s]));
function effDow(id, w) { const m = (S.moves || {})[w]; return m && m[id] != null ? m[id] : SESSBYID[id].dow; }
function planFor(w, dow) { return ALLSESS.filter(s => effDow(s.id, w) === dow); }

const HABITS = [
  ['supp', 'Supplements'], ['mask', 'Red light mask'],
  ['alc', 'Alcohol-free'], ['smoke', 'Breathe easy'],
  ['bed', 'In bed by 22:30'], ['sleep', '7–8 hours sleep']
];

const BLOCKS = [
  { n: 'Build', note: 'Weeks 1–4. Leave 2–3 reps in the tank. Find working loads and log them.' },
  { n: 'Push', note: 'Weeks 5–7. Leave 1–2 reps in the tank. When every set hits the top of the range, add load next time.' },
  { n: 'Taper', note: 'Week 8. One set fewer, same loads. Arrive in Japan fresh, not sore.' }
];

// sets and reps per block: [Build, Push, Taper]
const SESS = {
  lowerA: {
    title: 'Lower A', when: 'Sunday, 50 min', why: 'Heaviest leg day. Four days clear of the Saturday intervals.',
    warm: ['5 min easy bike or rower', 'Glute bridge 2 × 10', 'Bodyweight squat 2 × 10', 'Leg swings, 10 each way'],
    ex: [
      { id: 'squat', n: 'Squat (back or goblet)', sets: [3, 4, 3], reps: ['8', '6–8', '6'] },
      { id: 'rdl', n: 'Romanian deadlift', sets: [3, 3, 2], reps: ['8–10', '8', '8'] },
      { id: 'legpress', n: 'Leg press', sets: [3, 3, 2], reps: ['10–12', '10', '10'] },
      { id: 'legext', n: 'Leg extension', sets: [2, 3, 2], reps: ['12–15', '12', '12'] },
      { id: 'legcurl', n: 'Seated leg curl', sets: [3, 3, 2], reps: ['10–12', '10', '10'] },
      { id: 'deadbug', n: 'Dead bug', sets: [2, 3, 2], reps: ['8 each side', '10 each side', '8 each side'], nolog: true }
    ]
  },
  upperA: {
    title: 'Upper A', when: 'Tuesday, 45 min, before spin', why: 'Push emphasis. Legs stay fresh for the spin class.',
    warm: ['Band pull-apart 2 × 15', 'Arm circles, 10 each way', 'Incline push-up 2 × 8', 'Light dumbbell press 1 × 12'],
    ex: [
      { id: 'dbbench', n: 'Dumbbell bench press', sets: [3, 4, 3], reps: ['8–10', '6–8', '8'] },
      { id: 'pullup', n: 'Assisted pull-up', sets: [3, 4, 3], reps: ['6–8', '6–8', '6'], assist: true, note: 'Log the assistance weight. Lower is progress.' },
      { id: 'dbpress', n: 'Seated dumbbell shoulder press', sets: [3, 3, 2], reps: ['8–10', '8', '8'] },
      { id: 'cablerow', n: 'Seated cable row', sets: [3, 3, 2], reps: ['10–12', '10', '10'] },
      { id: 'lateral', n: 'Cable lateral raise', sets: [2, 3, 2], reps: ['12–15', '12–15', '12'] },
      { id: 'pushdown', n: 'Triceps rope pushdown', sets: [2, 2, 2], reps: ['12–15', '12', '12'] }
    ]
  },
  lowerB: {
    title: 'Lower B', when: 'Wednesday, 40 min, before yin', why: 'Lighter leg day. You have cycled in already, so this is glutes and single-leg work, not a grind.',
    warm: ['5 min easy bike', 'Glute bridge 2 × 12', 'Walking lunge 1 × 8 each leg', 'Hip flexor stretch, 30 s each side'],
    ex: [
      { id: 'hipthrust', n: 'Hip thrust', sets: [3, 4, 3], reps: ['8–10', '8', '8'] },
      { id: 'splitsquat', n: 'Bulgarian split squat', sets: [2, 3, 2], reps: ['8 each leg', '8 each leg', '8 each leg'] },
      { id: 'backext', n: 'Back extension', sets: [2, 3, 2], reps: ['12', '12', '10'] },
      { id: 'legext', n: 'Leg extension', sets: [2, 2, 2], reps: ['15', '12–15', '12'] },
      { id: 'sideplank', n: 'Side plank', sets: [2, 3, 2], reps: ['30 s each side', '40 s each side', '30 s each side'], nolog: true }
    ]
  },
  upperB: {
    title: 'Upper B', when: 'Friday, 45 min, before dance', why: 'Pull emphasis. Nothing that fries your legs before dance or Saturday intervals.',
    warm: ['Band pull-apart 2 × 15', 'Scapular pull-up or hang 2 × 8', 'Light lat pulldown 1 × 12', 'Thoracic rotations, 8 each side'],
    ex: [
      { id: 'pulldown', n: 'Lat pulldown', sets: [3, 4, 3], reps: ['8–10', '8', '8'] },
      { id: 'inclinedb', n: 'Incline dumbbell press', sets: [3, 3, 2], reps: ['8–10', '8', '8'] },
      { id: 'csrow', n: 'Chest-supported row', sets: [3, 3, 2], reps: ['10', '8–10', '10'] },
      { id: 'facepull', n: 'Face pull', sets: [2, 3, 2], reps: ['15', '15', '12'] },
      { id: 'kneelpress', n: 'Half-kneeling single-arm cable press', sets: [2, 3, 2], reps: ['10 each side', '10 each side', '8 each side'], note: 'Squeeze the glute on the down knee. Don\'t let the cable twist you.' },
      { id: 'pushup', n: 'Push-up', sets: [2, 2, 1], reps: ['as many clean reps as possible', 'as many clean reps as possible', 'as many clean reps as possible'], nolog: true }
    ]
  },
  core: {
    title: 'Core and carry', when: 'Saturday, 25 min, after the run', why: 'Counts as your fifth strength session. Trunk and grip only, so legs recover for Sunday.',
    warm: ['The run is your warm-up'],
    ex: [
      { id: 'carry', n: 'Farmer carry', sets: [3, 3, 2], reps: ['30 m', '30 m', '30 m'], note: 'Log the weight per hand.' },
      { id: 'woodchop', n: 'Cable woodchop', sets: [2, 3, 2], reps: ['10 each side', '10 each side', '10 each side'] },
      { id: 'pallof', n: 'Pallof press', sets: [2, 3, 2], reps: ['10 each side', '10 each side', '10 each side'] },
      { id: 'birddog', n: 'Bird dog', sets: [2, 2, 2], reps: ['8 each side', '8 each side', '8 each side'], nolog: true },
      { id: 'plank', n: 'Front plank', sets: [2, 3, 2], reps: ['30 s', '45 s', '30 s'], nolog: true }
    ]
  }
};
const INTERVALS = {
  main: ['6 × 1 min hard, 2 min easy', '8 × 1 min hard, 90 s easy', '5 × 1 min hard, 2 min easy'],
  warm: '10 min easy jog building to steady',
  cool: '5 min walk',

/* ---------- Countdown ---------- */
function countdown() {

  if (days < 7) return { en: cap(WORDS[days]) + (days === 1 ? ' day' : ' days') + ' to Japan', jp: '日本まであと' + days + '日' };
  const lastSat = addDays(t, -((t.getDay() + 1) % 7));
  const wks = Math.round(daysBetween(lastSat, DEPART) / 7);
  return { en: cap(WORDS[wks] || String(wks)) + (wks === 1 ? ' week' : ' weeks') + ' to Japan', jp: '日本まであと' + wks + '週間' };

  });

  (o.dots || []).forEach(([x, v]) => { g += `<circle class="dot" cx="${X(x).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"/>`; });

}
function corridorAt(x) {
  const f = Math.min(1, Math.max(0, x / 56));
  return [START_KG - (START_KG - REAL_HI) * f, START_KG - (START_KG - REAL_LO) * f];
}
function weightBlock() {
  const pts = series('weight').map(([d, v]) => [dayX(d), v]).filter(([x]) => x >= 0 && x <= 56);
  const ma = pts.map(([x]) => { const w = pts.filter(([y]) => y <= x && y > x - 7).map(p => p[1]); return [x, w.reduce((a, b) => a + b, 0) / w.length]; });
  const vals = pts.map(p => p[1]);
  const y0 = Math.floor(Math.min(STRETCH_KG - 0.5, ...vals.map(v => v - 0.5)));
  const y1 = Math.ceil(Math.max(START_KG + 1, ...vals.map(v => v + 0.5)));
  const nowX = dayX(today());
  let status = 'Log or sync a weight to start the line.';
  if (ma.length) {
    const last = ma[ma.length - 1], [hi, lo] = corridorAt(last[0]);
    const change = last[1] - START_KG;
    const where = last[1] < lo ? 'Ahead of the realistic corridor.' : last[1] <= hi ? 'Inside the realistic corridor.' : 'Above the corridor. Watch the trend, not single days.';
    status = `7-day average ${fmt(last[1], 1)} kg, ${change <= 0 ? 'down' : 'up'} ${fmt(Math.abs(change), 1)} kg from ${START_KG}. ${where} Corridor today: ${fmt(lo, 1)}–${fmt(hi, 1)} kg.`;
  }
  return `<section class="sec"><h2>Weight</h2>${svgChart({
    label: 'Weight trend against target corridor', x0: 0, x1: 56, y0, y1, dp: 0, nowX,
    band: [[0, START_KG], [56, REAL_HI], [56, REAL_LO], [0, START_KG]],
    lines: [{ cls: 'stretch', pts: [[0, START_KG], [56, STRETCH_KG]] }, { cls: 'ma', pts: ma }],
    dots: pts, xlabels: [[0, '26 Sep'], [28, '24 Oct'], [56, '21 Nov']], h: 200
  })}
  <div class="legend"><span><i style="background:var(--gold)"></i>7-day average</span><span><i style="background:rgba(163,184,108,.5);height:8px"></i>Realistic, ${START_KG - REAL_HI}–${START_KG - REAL_LO} kg</span><span><i style="border-top:1.5px dashed var(--mu);height:0"></i>Stretch, ${START_KG - STRETCH_KG} kg</span></div>
  <p class="status">${status}</p></section>`;
}
function smallChart(k) {
  const m = METBYK[k], nowX = dayX(today());
  const pts = series(k).map(([d, v]) => [dayX(d), v]).filter(([x]) => x > nowX - 28 && x <= nowX);
  if (!pts.length) return `<p class="empty">No ${m.n.toLowerCase()} data in the last four weeks.</p>`;
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (k === 'sleep') { lo = Math.min(lo, 6); hi = Math.max(hi, 8.5); }
  const padv = (hi - lo) * 0.15 || Math.max(1, hi * 0.05);
  return svgChart({
    label: m.n + ', last four weeks', x0: nowX - 27, x1: nowX, y0: lo - padv, y1: hi + padv, dp: m.dp, h: 130,
    refs: k === 'sleep' ? [7] : [], lines: [{ cls: 'ln', pts }], dots: pts,
    xlabels: [[nowX - 27, short(addDays(today(), -27))], [nowX, 'Today']]
  });
}
function tile(k) {
  const m = METBYK[k], s = series(k), last = s[s.length - 1];
  const t = ymd(today()), wk = ymd(addDays(today(), -6));
  const avg = avgBetween(k, wk, t);
  return `<div class="tile"><small>${m.n}</small><p class="v">${last ? fmt(last[1], m.dp) : '–'}<span> ${m.u}</span></p>
    <small>${avg != null ? '7-day ' + fmt(avg, m.dp) : 'No recent data'}</small></div>`;
}

function vTrack() {
  const t = ymd(today());
  let h = `<section class="sec"><h2>Sync from Health</h2><p class="sec-sub">Run your Sync health shortcut, then paste here.</p>
    <div class="row"><button class="btn primary" data-act="sync">Paste from Health</button></div>
    <details id="pastebox"><summary>Paste manually instead</summary><textarea id="pastearea" rows="5" placeholder="weight=90.4&#10;bodyfat=33.1"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn small" data-act="syncpaste">Import pasted text</button></div></details>
    <details class="help"><summary>Set up the shortcut</summary>${SHORTCUT_HELP}</details></section>`;
  h += `<section class="sec"><h2>Latest</h2><div class="tiles" style="margin-top:10px">${MET.map(m => tile(m.k)).join('')}</div></section>`;
  h += weightBlock();
  [['bodyfat', 'Body fat'], ['lean', 'Lean mass'], ['sleep', 'Sleep'], ['hrv', 'HRV'], ['rhr', 'Resting heart rate'], ['vo2', 'VO₂ max'], ['steps', 'Steps'], ['active', 'Active energy']].forEach(([k, n]) => {
    h += `<section class="sec"><div class="spread"><h2>${n}</h2><small>${METBYK[k].u}</small></div>${smallChart(k)}</section>`;
  });
  h += `<section class="sec"><h2>Add manually</h2><div class="mform" style="margin-top:10px">
    <label style="grid-column:1/-1">Date<input type="date" id="m-date" value="${t}"></label>
    ${MET.map(m => `<label>${m.n}${m.u ? ' (' + m.u + ')' : ''}<input type="number" inputmode="decimal" step="any" id="m-${m.k}"></label>`).join('')}
    </div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="manual">Save entry</button></div></section>`;
  h += `<section class="sec"><h2>Backup</h2><p class="sec-sub">Everything lives on this phone. Copy a backup now and then and keep it in Notes.</p>
    <div class="row"><button class="btn small" data-act="backup">Copy backup</button><button class="btn small" data-act="restoreopen">Restore</button></div>
    <div id="restorebox" hidden><textarea id="restorearea" rows="4" placeholder="Paste a backup" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="restore">Restore from backup</button></div></div></section>`;
  h += totalsBlock();
  return h;
}

function totalsBlock() {
  const tot = Object.fromEntries(Object.keys(TYPES).map(k => [k, 0]));
  let all = 0;
  for (let w = 1; w <= WEEKS; w++) { const c = countByType(w); Object.keys(c).forEach(k => { tot[k] += c[k]; all += c[k]; }); }
  const elapsed = Math.max(0, Math.min(daysBetween(START, today()) + 1, daysBetween(START, DEPART)));
  const hab = Object.fromEntries(HABITS.map(([k]) => [k, 0]));
  for (let i = 0; i < elapsed; i++) { const d = ymd(addDays(START, i)); HABITS.forEach(([k]) => { if (habitOn(d, k)) hab[k]++; }); }
  let h = `<section class="sec"><div class="spread"><h2>Programme totals</h2><small>${all} of ${TOTAL * WEEKS} stamps</small></div>
    <h3 style="margin:10px 0 2px">Stamps</h3><ul class="snacks">${Object.entries(TYPES).map(([k, T]) =>
      `<li><span class="row"><span class="seal on" style="width:28px;height:28px;font-size:.85rem" aria-hidden="true">${T.k}</span>${T.n}</span><span><b>${tot[k]}</b> <small>of ${T.max * WEEKS}</small></span></li>`).join('')}</ul>
    <h3 style="margin:14px 0 2px">Habits</h3><ul class="snacks">${HABITS.map(([k, n]) =>
      `<li><span>${n}</span><span><b>${hab[k]}</b> <small>of ${elapsed} ${elapsed === 1 ? 'day' : 'days'}</small></span></li>`).join('')}</ul></section>`;
  return h;
}

const SHORTCUT_HELP = `<ol>
<li>In Shortcuts, create a shortcut called <b>Sync health</b>.</li>
<li>For each of <b>Weight</b>, <b>Body Fat Percentage</b>, <b>Lean Body Mass</b>, <b>Heart Rate Variability</b>, <b>Resting Heart Rate</b> and <b>VO₂ Max</b>, add <b>Find Health Samples</b>: Type is that metric, sort by Start Date, Latest First, Limit 1.</li>
<li>For <b>Steps</b> and <b>Active Energy</b>: Find Health Samples where Start Date is today, then <b>Calculate Statistics</b>, Sum.</li>
<li>For sleep: Find Health Samples, Type is Sleep Analysis, Start Date is in the last 1 day, Value is not In Bed and not Awake. Then <b>Get Details of Health Samples</b>, Duration, then Calculate Statistics, Sum. This is the fiddly one. If it misbehaves on your iOS version, leave it out and tick the habit by hand.</li>
<li>Add a <b>Text</b> action with one line per metric, inserting each result. Tap each inserted sample and choose <b>Value</b>:
<pre>weight=[Value]
bodyfat=[Value]
lean=[Value]
hrv=[Value]
rhr=[Value]
vo2=[Value]
steps=[Sum]
active=[Sum]
sleep=[Sum]</pre></li>
<li>End with <b>Copy to Clipboard</b>. Put the shortcut on your home screen next to this app, or on Back Tap.</li>
</ol>
<p>Units and formats are forgiving: “91.2 kg”, “0.331” for body fat, “7 hr 12 min” or seconds for sleep all work. To backfill history, lines can also be <code>weight|2026-09-20|91.4</code>.</p>`;

/* ---------- Health text parser ---------- */
const ALIAS = { weight: 'weight', w: 'weight', mass: 'weight', bodyfat: 'bodyfat', fat: 'bodyfat', bf: 'bodyfat', bodyfatpercentage: 'bodyfat',
  lean: 'lean', leanmass: 'lean', leanbodymass: 'lean', sleep: 'sleep', hrv: 'hrv', heartratevariability: 'hrv', rhr: 'rhr', resting: 'rhr',
  restinghr: 'rhr', restingheartrate: 'rhr', vo2: 'vo2', vo2max: 'vo2', steps: 'steps', active: 'active', activeenergy: 'active', energy: 'active' };
function num(s) { const m = String(s).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
function hours(s) {
  s = String(s).toLowerCase().replace(/,/g, '');
  let m = s.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b[^\d]*(\d+)?/);
  if (m) return +m[1] + (m[2] ? +m[2] / 60 : 0);
  m = s.match(/^\s*(\d+):(\d{2})/); if (m) return +m[1] + +m[2] / 60;
  const v = num(s); if (isNaN(v)) return NaN;
  if (/min/.test(s)) return v / 60;
  if (v > 1000) return v / 3600;
  if (v > 24) return v / 60;
  return v;
}
function toDate(s) {
  const m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  const d = new Date(String(s).replace(/\sat\s/i, ' '));
  return isNaN(d) ? null : ymd(d);
}
function parseHealth(text) {
  const out = []; let dflt = ymd(today());
  String(text).split(/\r?\n/).forEach(line => {
    line = line.trim(); if (!line) return;
    let key, date = null, raw;
    if (line.includes('|')) { const p = line.split('|'); key = p[0]; date = toDate(p[1]); raw = p.slice(2).join('|'); }
    else { const m = line.match(/^([^=:]+)[=:](.*)$/); if (!m) return; key = m[1]; raw = m[2]; }
    key = key.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (key === 'date') { const d = toDate(raw); if (d) dflt = d; return; }
    const k = ALIAS[key]; if (!k) return;
    let v = k === 'sleep' ? hours(raw) : num(raw);
    if (isNaN(v)) return;
    if (k === 'bodyfat' && v > 0 && v < 1) v *= 100;
    if ((k === 'weight' || k === 'lean') && /lb/i.test(raw)) v *= 0.45359237;
    out.push({ d: date || dflt, k, v: Math.round(v * 100) / 100 });
  });
  return out;
}
function importHealth(text) {
  const rows = parseHealth(text);
  if (!rows.length) { toast('Nothing recognised. Expected lines like weight=90.4'); return false; }
  rows.forEach(r => { (S.metrics[r.d] = S.metrics[r.d] || {})[r.k] = r.v; });
  save(); render();
  const days = new Set(rows.map(r => r.d)).size;
  toast(`Synced ${rows.length} value${rows.length === 1 ? '' : 's'}${days > 1 ? ' across ' + days + ' days' : ''}.`);
  return true;
}

/* ---------- Actions ---------- */
const ACT = {
  tab: el => { tab = el.dataset.k; viewWeek = null; render(); window.scrollTo(0, 0); },
  viewweek: el => { const n = +el.dataset.w; viewWeek = n === weekNum(today()) ? null : n; render(); window.scrollTo(0, 0); },
  sess: el => {
    const w = +el.dataset.wk, id = el.dataset.id;
    S.done[w] = S.done[w] || {};
    if (S.done[w][id]) { delete S.done[w][id]; justStamped = null; }
    else { S.done[w][id] = ymd(today()); justStamped = id; if (navigator.vibrate) navigator.vibrate(12); }
    const n = sessionsDone(w);
    save(); render();
    if (justStamped && n === FLOOR) toast('Winning week banked.');
    else if (justStamped && n === TOTAL) toast('Full card.');
    justStamped = null;
  },
  habit: el => {
    const d = el.dataset.d, k = el.dataset.k;
    S.habits[d] = S.habits[d] || {};
    if (habitOn(d, k) && !S.habits[d][k] && k === 'sleep') { toast('Ticked from Health sleep data.'); return; }
    S.habits[d][k] = !S.habits[d][k]; save(); render();
  },
  train: el => { trainSel = el.dataset.k; render(); },
  resetmoves: el => { delete S.moves[+el.dataset.wk]; save(); render(); toast('Week back to the usual plan.'); },
  wake: async () => {
    if (wakeLock) { wantWake = false; try { await wakeLock.release(); } catch (e) {} wakeLock = null; render(); return; }
    try { wakeLock = await navigator.wakeLock.request('screen'); wantWake = true; wakeLock.addEventListener('release', () => { wakeLock = null; render(); }); }
    catch (e) { toast('Keeping the screen on is not supported here.'); }
    render();
  },
  prep: el => {
    const w = weekNum(today()), p = prepFor(w), slot = el.dataset.slot, m = S.meals.dinner[+el.dataset.i];
    const i = p[slot].indexOf(m);
    if (i >= 0) p[slot].splice(i, 1);
    else { if (p[slot].length >= 2) { toast('Two recipes per cook. Deselect one first.'); return; } p[slot].push(m); }
    save(); render();
  },
  mealadd: el => {
    const k = el.dataset.list, inp = document.getElementById('add-' + k), v = inp.value.trim();
    if (!v) return; if (S.meals[k].includes(v)) { toast('Already on the list.'); return; }
    S.meals[k].push(v); save(); render();
  },
  mealdel: el => {
    const k = el.dataset.list, i = +el.dataset.i;
    if (S.meals[k].length <= 1) { toast('Keep at least one option.'); return; }
    S.meals[k].splice(i, 1); save(); render();
  },
  sync: async () => {
    try { const txt = await navigator.clipboard.readText(); importHealth(txt); }
    catch (e) { const b = document.getElementById('pastebox'); if (b) b.open = true; toast('Clipboard not readable. Paste into the box.'); }
  },
  syncpaste: () => { const a = document.getElementById('pastearea'); if (importHealth(a.value)) a.value = ''; },
  manual: () => {
    const d = document.getElementById('m-date').value; if (!d) { toast('Pick a date.'); return; }
    let n = 0;
    MET.forEach(m => { const v = parseFloat(document.getElementById('m-' + m.k).value); if (!isNaN(v)) { (S.metrics[d] = S.metrics[d] || {})[m.k] = v; n++; } });
    if (!n) { toast('Enter at least one value.'); return; }
    save(); render(); toast(`Saved ${n} value${n === 1 ? '' : 's'} for ${short(parseYmd(d))}.`);
  },
  backup: async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Backup copied.'); }
    catch (e) { toast('Could not copy. Clipboard access was refused.'); }
  },
  restoreopen: () => { const b = document.getElementById('restorebox'); b.hidden = !b.hidden; },
  restore: () => {
    try {
      const o = JSON.parse(document.getElementById('restorearea').value);
      if (!o || typeof o !== 'object' || !o.done) throw 0;
      S = Object.assign(JSON.parse(JSON.stringify(DEF)), o); save(); render(); toast('Restored.');
    } catch (e) { toast('That is not a valid backup.'); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'lift') {
    const id = el.dataset.ex, d = ymd(today()), v = parseFloat(el.value);
    const arr = (S.lifts[id] || []).filter(x => x.d !== d);
    if (!isNaN(v)) arr.push({ d, kg: v });
    arr.sort((a, b) => a.d < b.d ? -1 : 1);
    S.lifts[id] = arr; save();
    if (!isNaN(v)) toast('Logged.');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('add-')) {
    const b = e.target.parentElement.querySelector('[data-act="mealadd"]'); if (b) b.click();
  }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (wantWake && !wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  render();
});

/* ---------- Drag to move sessions ---------- */
function moveSession(w, id, dow) {
  if (effDow(id, w) === dow) return;
  S.moves = S.moves || {};
  const m = S.moves[w] = S.moves[w] || {};
  if (dow === SESSBYID[id].dow) delete m[id]; else m[id] = dow;
  if (!Object.keys(m).length) delete S.moves[w];
  save(); render();
  const runIdx = DAYORDER.indexOf(effDow('sat-run', w));
  const clash = ['sun-lowerA', 'wed-lowerB'].some(x => { const i = DAYORDER.indexOf(effDow(x, w)); return [0, 1, 6].includes((i - runIdx + 7) % 7); });
  toast(`Moved ${SESSBYID[id].n} to ${DAYNAME[dow]}.` + (clash ? ' Heads up: a leg day now sits next to the intervals.' : ''));
}
let drag = null, suppressClick = false;
function dragStart(el, x, y, mouse) {
  drag = { el, id: el.dataset.id, wk: +el.dataset.wk, sx: x, sy: y, mouse, active: false };
  if (!mouse) drag.timer = setTimeout(() => activateDrag(x, y), 380);
}
function activateDrag(x, y) {
  if (!drag) return;
  const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-act'); g.style.width = r.width + 'px';
  document.body.appendChild(g);
  Object.assign(drag, { active: true, ghost: g, ox: x - r.left, oy: y - r.top });
  drag.el.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(15);
  placeGhost(x, y);
}
function placeGhost(x, y) {
  drag.ghost.style.left = (x - drag.ox) + 'px'; drag.ghost.style.top = (y - drag.oy) + 'px';
  const over = document.elementFromPoint(x, y);
  const day = over && over.closest('[data-dropday]');
  document.querySelectorAll('.drop-over').forEach(n => { if (n !== day) n.classList.remove('drop-over'); });
  if (day) day.classList.add('drop-over');
  if (y < 90) window.scrollBy(0, -10); else if (y > window.innerHeight - 120) window.scrollBy(0, 10);
}
function dragMove(x, y, e) {
  if (!drag) return;
  if (!drag.active) {
    if (Math.hypot(x - drag.sx, y - drag.sy) > 8) {
      if (drag.mouse) activateDrag(drag.sx, drag.sy); else { clearTimeout(drag.timer); drag = null; return; }
    } else return;
  }
  if (e.cancelable) e.preventDefault();
  placeGhost(x, y);
}
function dragEnd(x, y) {
  if (!drag) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  if (!d.active) return;
  d.ghost.remove(); d.el.classList.remove('dragging');
  document.querySelectorAll('.drop-over').forEach(n => n.classList.remove('drop-over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  const over = x == null ? null : document.elementFromPoint(x, y);
  const day = over && over.closest('[data-dropday]');
  if (day) moveSession(d.wk, d.id, +day.dataset.dropday);
}
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (drag || e.target.closest('[data-drag]')) e.preventDefault(); });
document.addEventListener('touchstart', e => {
  const el = e.target.closest('[data-drag]'); if (!el || e.touches.length > 1) return;
  dragStart(el, e.touches[0].clientX, e.touches[0].clientY, false);
}, { passive: true });
document.addEventListener('touchmove', e => { if (drag) dragMove(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false });
document.addEventListener('touchend', e => { if (drag) { const t = e.changedTouches[0]; if (drag.active && e.cancelable) e.preventDefault(); dragEnd(t.clientX, t.clientY); } });
document.addEventListener('touchcancel', () => dragEnd(null, null));
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return; const el = e.target.closest('[data-drag]'); if (!el) return;
  dragStart(el, e.clientX, e.clientY, true);
});
document.addEventListener('mousemove', e => { if (drag && drag.mouse) dragMove(e.clientX, e.clientY, e); });
document.addEventListener('mouseup', e => { if (drag && drag.mouse) dragEnd(e.clientX, e.clientY); });

/* ---------- Render ---------- */
const TABS = [['today', '今日', 'Today'], ['week', '週', 'Week'], ['train', '稽古', 'Train'], ['eat', '食', 'Eat'], ['track', '記録', 'Track']];
const VIEWS = { today: vToday, week: vWeek, train: vTrain, eat: vEat, track: vTrack };
function render() {
  const c = countdown(), t = today(), w = weekNum(t);
  const pre = daysBetween(START, t) < 0;
  document.getElementById('hd').innerHTML = `<h1 class="cd">${c.en}</h1><p class="cd-jp" lang="ja">${c.jp}</p>
    <p class="hd-meta">${pre ? 'Starts Saturday 26 September' : `Week ${w} of ${WEEKS}, ${BLOCKS[blockOf(w)].n} block`}</p>`;
  document.getElementById('main').innerHTML = VIEWS[tab]();
  document.getElementById('nav').innerHTML = TABS.map(([k, j, n]) =>
    `<button data-act="tab" data-k="${k}"${tab === k ? ' aria-current="page"' : ''}><span class="k" lang="ja" aria-hidden="true">${j}</span>${n}</button>`).join('');
}
render();
</script>
